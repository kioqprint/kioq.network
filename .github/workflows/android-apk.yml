name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed update APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install Android SDK 35
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare persistent signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing repository secret ANDROID_KEYSTORE_BASE64" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kioq-release.jks"

      - name: Verify signing credentials before Gradle
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kioq-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > "$RUNNER_TEMP/VerifySigningKey.java" <<'EOF'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;

          public class VerifySigningKey {
            public static void main(String[] args) throws Exception {
              KeyStore store = KeyStore.getInstance("JKS");
              try (FileInputStream input = new FileInputStream(System.getenv("ANDROID_KEYSTORE_PATH"))) {
                try {
                  store.load(input, System.getenv("ANDROID_KEYSTORE_PASSWORD").toCharArray());
                } catch (Exception e) {
                  System.err.println("SIGNING CHECK FAILED: keystore password or keystore file is invalid.");
                  System.exit(11);
                }
              }
              String alias = System.getenv("ANDROID_KEY_ALIAS");
              if (!store.containsAlias(alias)) {
                System.err.println("SIGNING CHECK FAILED: configured key alias does not exist in the keystore.");
                System.exit(12);
              }
              try {
                Key key = store.getKey(alias, System.getenv("ANDROID_KEY_PASSWORD").toCharArray());
                if (key == null || !"PKCS#8".equalsIgnoreCase(key.getFormat())) {
                  System.err.println("SIGNING CHECK FAILED: alias does not contain a readable private key.");
                  System.exit(13);
                }
              } catch (Exception e) {
                System.err.println("SIGNING CHECK FAILED: ANDROID_KEY_PASSWORD does not unlock the private key for the configured alias.");
                System.exit(14);
              }
              System.out.println("SIGNING CHECK PASSED: keystore, alias, and private-key password are valid.");
            }
          }
          EOF
          javac "$RUNNER_TEMP/VerifySigningKey.java"
          java -cp "$RUNNER_TEMP" VerifySigningKey

      - name: Build signed release APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kioq-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Build debug APK for pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload signed update APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: KIOQ-network-update-v${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload pull request debug APK
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: KIOQ-network-pull-request-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
